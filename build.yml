name: build-apk
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  apk:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf automake libtool pkg-config zlib1g-dev \
            libncurses-dev cmake libffi-dev libssl-dev build-essential ccache libltdl-dev
          pip install --upgrade pip wheel "setuptools<81" buildozer "cython==0.29.37"
      - name: Stamp build
        run: |
          printf 'BUILD = "%s"\nSHA = "%s"\n' "${{ github.run_number }}" "${GITHUB_SHA::7}" > core/build_info.py
      - name: Tests
        run: python -I -m unittest discover -s tests
      - name: Build
        run: buildozer android debug
      - uses: actions/upload-artifact@v4
        with:
          name: zametki-apk-${{ github.run_number }}
          path: bin/*.apk
